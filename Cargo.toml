[workspace]
members = [
    "compositions/messaging/local-queue-pipeline",
    "compositions/web/http-server",
    "compositions/web/local-backend",
    "examples/key-value-quickstart",
    "examples/http-server",
    "examples/local-backend",
    "examples/local-queue-pipeline",
    "examples/observed-queue",
    "hosts/linux",
    "packages/data/key-value",
    "packages/data/relational-database",
    "packages/data/sqlite",
    "packages/execution/process-runtime",
    "packages/messaging/queue",
    "packages/networking/http",
    "packages/networking/tcp",
    "packages/observability/counter",
    "packages/observability/logging",
    "packages/security/ed25519",
    "examples/ed25519-signing",
    "tests/third-party-consumer",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Onoal/fabric-ecosystem"
version = "0.1.0"

[workspace.dependencies]
fabric = { package = "onoal-fabric", version = "1.0.0" }
fabric-composition-http-server = { package = "onoal-fabric-composition-http-server", version = "0.1.0", path = "compositions/web/http-server" }
fabric-composition-local-backend = { package = "onoal-fabric-composition-local-backend", version = "0.1.0", path = "compositions/web/local-backend" }
fabric-composition-local-queue-pipeline = { package = "onoal-fabric-composition-local-queue-pipeline", version = "0.1.0", path = "compositions/messaging/local-queue-pipeline" }
fabric-host-linux = { package = "onoal-fabric-host-linux", version = "0.1.0", path = "hosts/linux" }
fabric-package-key-value = { package = "onoal-fabric-package-key-value", version = "0.1.0", path = "packages/data/key-value" }
fabric-package-relational-database = { package = "onoal-fabric-package-relational-database", version = "0.1.0", path = "packages/data/relational-database" }
fabric-package-sqlite = { package = "onoal-fabric-package-sqlite", version = "0.1.0", path = "packages/data/sqlite" }
fabric-package-messaging-queue = { package = "onoal-fabric-package-messaging-queue", version = "0.1.0", path = "packages/messaging/queue" }
fabric-package-networking-http = { package = "onoal-fabric-package-networking-http", version = "0.1.0", path = "packages/networking/http" }
fabric-package-networking-tcp = { package = "onoal-fabric-package-networking-tcp", version = "0.1.0", path = "packages/networking/tcp" }
fabric-package-observability-counter = { package = "onoal-fabric-package-observability-counter", version = "0.1.0", path = "packages/observability/counter" }
fabric-package-observability-logging = { package = "onoal-fabric-package-observability-logging", version = "0.1.0", path = "packages/observability/logging" }
fabric-package-process-runtime = { package = "onoal-fabric-package-process-runtime", version = "0.1.0", path = "packages/execution/process-runtime" }
fabric-package-security-ed25519 = { package = "onoal-fabric-package-security-ed25519", version = "0.1.0", path = "packages/security/ed25519" }
futures = "0.3"
httparse = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
