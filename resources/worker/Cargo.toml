[package]
name = "fabric-resource-worker"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = "0.8.4"
base64 = "0.22.1"
hex = "0.4.3"
rand = "0.9.2"
rusqlite = { version = "0.37.0", features = ["bundled"] }
semver = "1.0.27"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
fabric-binding.workspace = true
fabric-projection.workspace = true
fabric-resource-registry.workspace = true
fabric-core.workspace = true
fabric-resource-database.workspace = true
fabric-resource-kv.workspace = true
fabric-resource.workspace = true
fabric-resource-secrets.workspace = true
fabric-resource-service.workspace = true
thiserror = "2.0.20"
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread", "sync"] }

[dev-dependencies]
fabric-adapter-authority-cedar.workspace = true
fabric-adapter-database-sqlite.workspace = true
fabric-resource-authority.workspace = true
tempfile = "3.23.0"
ureq = { version = "3.1.2", features = ["json"] }
